[project]
name = "hcmc-aic"
version = "0.1.0"
description = "HCMC AI Challenge - Video Retrieval System"
requires-python = ">=3.10"

dependencies = [
    # ML / Embedding
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "Pillow>=9.0.0",
    "numpy>=1.24.0",
    "faiss-cpu>=1.7.4",            # hoặc faiss-gpu nếu dùng GPU
    "open-clip-torch>=2.20.0",     # OpenCLIP với laion pretrained weights
    "transformers>=4.40.0",
    "sentence-transformers>=3.0.0",

    # API server
    "fastapi[standard]>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",

    # Utilities
    "requests>=2.31.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
gpu = [
    "faiss-gpu>=1.7.4",
]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.24.0",       # dùng để test FastAPI
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
